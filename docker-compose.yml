services:
  app:
    image: ghcr.io/basketikun/infinite-canvas:latest
    container_name: infinite-canvas
    ports:
      - "3000:3000"
    restart: unless-stopped
    # OIDC 算力渠道（可选；所有值由部署环境提供）：
    # environment:
    #   OIDC_ISSUER: https://api.example.com
    #   OIDC_CLIENT_ID: oc-example
    #   OIDC_CLIENT_SECRET: change-me
    #   OIDC_SESSION_KEY: change-me-base64url-32-bytes
    #   OIDC_PROXY_TIMEOUT_MS: 600000
    #   OIDC_PROVIDER_NAME: Provider 名称
    #   PUBLIC_ORIGIN: https://canvas.example.com
    # 统计分析（可选，默认关闭）。每家一个独立变量，填了谁就启用谁，可同时启用多家：
    # environment:
    #   ANALYTICS_GA4_ID: G-XXXXXXXXXX                    # Google Analytics 4 衡量 ID
    #   ANALYTICS_BAIDU_ID: xxxxxxxxxxxxxxxxxxxxxxxxxxxx   # 百度统计站点 ID
