# Knative Service 部署清单。镜像内包含 Vite SPA 和同源 OIDC BFF。
# 部署前提：集群已安装 Knative Serving 与网络层（Kourier/Istio 等）。
# 使用：kubectl apply -f deploy/knative/service.yaml
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: infinite-canvas
spec:
  template:
    metadata:
      annotations:
        # BFF 无状态，允许缩容到 0；如需常驻改为 "1"。
        autoscaling.knative.dev/min-scale: "0"
        autoscaling.knative.dev/max-scale: "3"
    spec:
      # 与 OIDC BFF 的 OIDC_PROXY_TIMEOUT_MS=600000 保持一致。
      timeoutSeconds: 600
      containers:
        - image: ghcr.io/charzhou/infinite-canvas:v0.10.3
          ports:
            - containerPort: 3000
          env:
            - name: OIDC_ISSUER
              valueFrom: { secretKeyRef: { name: infinite-canvas-oidc, key: OIDC_ISSUER, optional: true } }
            - name: OIDC_GATEWAY_BASE_URL
              valueFrom: { secretKeyRef: { name: infinite-canvas-oidc, key: OIDC_GATEWAY_BASE_URL, optional: true } }
            - name: OIDC_CLIENT_ID
              valueFrom: { secretKeyRef: { name: infinite-canvas-oidc, key: OIDC_CLIENT_ID, optional: true } }
            - name: OIDC_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: infinite-canvas-oidc, key: OIDC_CLIENT_SECRET, optional: true } }
            - name: OIDC_SESSION_KEY
              valueFrom: { secretKeyRef: { name: infinite-canvas-oidc, key: OIDC_SESSION_KEY, optional: true } }
            - name: OIDC_PROVIDER_NAME
              valueFrom: { secretKeyRef: { name: infinite-canvas-oidc, key: OIDC_PROVIDER_NAME, optional: true } }
            - name: OIDC_REQUESTED_SCOPES
              valueFrom: { secretKeyRef: { name: infinite-canvas-oidc, key: OIDC_REQUESTED_SCOPES, optional: true } }
            - name: PUBLIC_ORIGIN
              valueFrom: { secretKeyRef: { name: infinite-canvas-oidc, key: PUBLIC_ORIGIN, optional: true } }
            - name: OIDC_PROXY_TIMEOUT_MS
              value: "600000"
          # 统计分析（可选，默认关闭）。填了谁就启用谁，可同时启用多家：
          # - name: ANALYTICS_GA4_ID
          #   value: G-XXXXXXXXXX
          # - name: ANALYTICS_BAIDU_ID
          #   value: xxxxxxxxxxxxxxxxxxxxxxxxxxxx
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 3000
