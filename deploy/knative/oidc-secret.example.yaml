# 复制到仓库外的私有文件后填入真实值，再执行 kubectl apply -f。
# 不要提交含真实 OIDC_CLIENT_SECRET 或 OIDC_SESSION_KEY 的 Secret。
apiVersion: v1
kind: Secret
metadata:
  name: infinite-canvas-oidc
type: Opaque
stringData:
  OIDC_ISSUER: https://ai.nekotech.us
  # 可选：将算力网关请求改走 CDN/加速域名；不填则默认使用 OIDC_ISSUER。
  OIDC_GATEWAY_BASE_URL: https://sub2api.tegical.com
  OIDC_CLIENT_ID: ""
  OIDC_CLIENT_SECRET: ""
  # 生成方式：openssl rand -base64 32 | tr '+/' '-_' | tr -d '=\\n'
  OIDC_SESSION_KEY: ""
  OIDC_PROVIDER_NAME: Sub2API
  # 必须是用户浏览器实际访问的 HTTPS Origin，不带路径。
  PUBLIC_ORIGIN: https://canvas.example.com
